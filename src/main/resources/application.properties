spring.application.name=checkup-booking-backend
server.port=${PORT:3000}

# H2 In-Memory Database with generous lock timeout for concurrent SELECT ... FOR UPDATE queuing
spring.datasource.url=jdbc:h2:mem:hospitaldb;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Pure backend API: disable web H2 console
spring.h2.console.enabled=false
